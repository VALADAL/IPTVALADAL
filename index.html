<!doctype html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VALADAL TV">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css"><title>VALADAL TV</title></head>
<body>
<header class="bar">
  <div class="top"><span class="brand">VALADAL <b>TV</b></span>
    <div class="acts"><button class="rbtn glass" id="bs" aria-label="Buscar">⌕</button><button class="rbtn glass" data-set aria-label="Ajustes">⚙</button></div></div>
  <nav class="pill glass" id="tabs"></nav>
  <input id="q" class="sbox glass hidden" type="search" placeholder="Buscar películas, series y canales" autocomplete="off">
</header>
<main id="main"></main>
<div id="sheet" class="wrap"><div class="scrim" data-x></div><div class="sheet" id="sb"></div></div>
<div id="player"><video id="vid" controls playsinline x-webkit-airplay="allow"></video>
  <div class="pb"><button class="rbtn glass" data-pc aria-label="Cerrar">✕</button><span class="t" id="pt"></span>
  <button class="rbtn glass" data-ap aria-label="AirPlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="m12 15 5 6H7z"/></svg></button></div></div>
<div id="toast" class="glass"></div>
<script src="app.js"></script>
</body></html>
